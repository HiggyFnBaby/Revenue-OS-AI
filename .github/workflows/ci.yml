name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the integration tests. Without it they would skip,
    # and the checks that matter most — the multi-tenant isolation boundary,
    # the stage-change transaction, the password reset lifecycle — are exactly
    # the ones that cannot be proven against a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local throwaway database, recreated per run. Not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revenue_os_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/revenue_os_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the app is developed and deployed on.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma client
        working-directory: app
        run: npx prisma generate

      # Fails if .claude/agents/*.md was edited without re-running
      # `npm run sync:agents`, which would ship stale prompts to production.
      - name: Check agent definitions are in sync
        working-directory: app
        run: npm run check:agents

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Create the test database schema
        working-directory: app
        run: npx prisma db push

      - name: Test
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      # Fails the build on a known vulnerability in anything that ships.
      - name: Audit production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
